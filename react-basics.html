<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>React Basics</title>
    <style>
      body
      {font-family: Arial, Helvetica, sans-serif;
      
      margin-top: 0px ;
      margin-bottom: 10px ;
      
      
      }
      .send-button {
        background-color: rgb(25,135, 84) ;
        color: white;
      padding: 12px 20px ;
       border: none ;
       border-radius: 10px ;
        cursor: pointer ;
        font-size: 15px; 
        margin-left: 10px  ;     
      
      }
      
      .chat-message-robot {
        display: flex;
        align-items: start;
        
      }
      .chat-input {
        padding: 12px 15px ;

        border-radius: 10px ;
        border-width: 1px;
        font-size: 15px; 
      flex-grow: 1  ;
      }

      .chat-input-container {
      display: flex;
        margin-bottom: 60px ;
      }


      .chat-messages-container {
        flex-grow: 1 ;
        margin-top: 20px ;
 
        overflow: scroll;
        
        scrollbar-width: none;
 
      } 
      .chat-message-user {display: flex;
      align-items: end ;
      justify-content: end ;                                                
      
      
      }
      
      .app-container {
        max-width: 600px ;
        margin-left: auto;
        margin-right: auto ;
        height: 100vh;
        display: flex ;
        flex-direction: column;
      }

      .chat-message-text{
        background-color:rgb(238, 238, 238) ;
        padding: 15px 20px ;
        border-radius: 10px ;
        margin-right: 10px ;
        margin-left: 10px ;
        margin-bottom: 20px ;
        max-width: 300px ;
      }


      .chat-message-profile {
        width: 45px ;
      }


    </style>





  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
  

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
     <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

          function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState("");

            function saveInputText(event) {
              setInputText(event.target.value);
            }

            function sendMessage() {
              const newChatMessages = [
                ...chatMessages,
                {
                  message:inputText,
                  sender: "user",
                  id: crypto.randomUUID(),
                },
              ]
              setChatMessages(newChatMessages);

              const response = chatbot.getResponse(inputText);
              setChatMessages((chatMessages) => [
                ...newChatMessages,
                {
                  message: response,
                  sender: "robot",
                  id: crypto.randomUUID(),
                },
              ]);
              

              setInputText("");
            }

            return (
              <div className="chat-input-container">
              <input
                placeholder = "Send a message to Chatbot"
                 size ="30"
                 onChange = {saveInputText}   
                 value={inputText}        
                className="chat-input"
                 />
              <button 
              onClick={sendMessage}
              className="send-button"
              >Send</button>
              </div> 
            );
           }
          
           function ChatMessage({ message, sender }) {
            return (
              <div className={sender === "user"
                       ? "chat-message-user"
                         : "chat-message-robot"
                }>
                {sender === "robot" && <img src="robot.png" className="chat-message-profile"                                 />}   
                <div className="chat-message-text"> 
                {message}
                </div>
                {sender === "user" && <img src="user.png"  className="chat-message-profile"/>}
              </div>
            );
           }

           function App() {
            const [chatMessages, setChatMessages] = React.useState([
              { message: "hello chatbot", sender: "user", id: "id1" },
              { message: "Hello! How can I help you?", sender: "robot", id: "id2" },
              { message: "what is today's date?", sender: "user", id: "id3" },
              { message: "Sure! Today's date is June 10, 2024.", sender: "robot", id: "id4" },
            ]);

            function ChatMessages({ chatMessages }) {  
              const chatMessagesRef = React.useRef(null);

              React.useEffect( () => {
                if (chatMessagesRef.current) {
                  chatMessagesRef.current.scrollTop = chatMessagesRef.current.scrollHeight;
                }
              }, [chatMessages]);

              return (
                <div className="chat-messages-container"
                 ref={chatMessagesRef}>
                  {chatMessages.map((chatMessage) => {
                      return ( 
                      <ChatMessage
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                      />
                    );
                  })}
                </div>
              );
            }

            return (
              <div className="app-container">
                <ChatMessages
                chatMessages={chatMessages}
                />
                   
                <ChatInput 
                chatMessages={chatMessages}
                 setChatMessages={setChatMessages}
                 />
              </div> 
            );
           }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
